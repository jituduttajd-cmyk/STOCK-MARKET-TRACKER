<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Market Tracker</title>
<meta name="theme-color" content="#0b5394">
<link rel="manifest" id="manifestLink">

<style>
  :root{
    --primary:#0b5394;--bg:#f4f6f9;--card:#ffffff;--border:#dfe3ea;
    --green:#1a7f37;--red:#c62828;--muted:#6b7280;
  }
  *{box-sizing:border-box}
  body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:#1f2430}
  header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  header h1{font-size:18px;margin:0}
  #dateBox{font-size:13px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:6px}
  .status-pill{font-size:12px;padding:4px 10px;border-radius:12px;font-weight:600}
  .status-live{background:#d1f7d1;color:var(--green)}
  .status-locked{background:#fde2e2;color:var(--red)}
  .toolbar{display:flex;gap:10px;padding:12px 20px;flex-wrap:wrap;align-items:center;background:var(--card);border-bottom:1px solid var(--border)}
  button{cursor:pointer;border:none;border-radius:6px;padding:9px 16px;font-size:14px;font-weight:600}
  #refreshBtn{background:var(--primary);color:#fff}
  #refreshBtn:disabled{background:#9aa5b1;cursor:not-allowed}
  #settingsBtn{background:#eef1f6;color:#1f2430}
  .search{padding:8px 10px;border:1px solid var(--border);border-radius:6px;min-width:200px}
  main{padding:16px 20px}
  .table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:8px}
  table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
  th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2){text-align:left;position:sticky;background:var(--card);z-index:2}
  th:nth-child(1),td:nth-child(1){left:0}
  th:nth-child(2),td:nth-child(2){left:150px}
  th:nth-child(3),td:nth-child(3){background:#eaf2ff;font-weight:700}
  thead th{background:#eef1f6;position:sticky;top:0;z-index:3}
  .today-col{background:#fff7d6}
  .locked-cell{color:var(--muted)}
  .live-cell{color:var(--green);font-weight:700}
  dialog{border:none;border-radius:10px;padding:0;width:min(520px,92vw)}
  dialog form{padding:20px;max-height:80vh;overflow-y:auto}
  dialog h3{margin-top:0}
  label{display:block;font-size:13px;margin:10px 0 4px;color:var(--muted)}
  input[type=text],input[type=password],input[type=number]{width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit}
  .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
  #logBox{font-size:12px;color:var(--muted);padding:6px 20px;max-height:100px;overflow-y:auto;white-space:pre-wrap;border-bottom:1px solid var(--border)}
  #logBox .err{color:var(--red);font-weight:700}
  .badge{font-size:11px;padding:2px 6px;border-radius:4px;background:#eef1f6;margin-left:6px}
  noscript{display:block;padding:20px;background:#fde2e2;color:var(--red);font-weight:600}
</style>

<body>

<noscript>This app requires JavaScript to be enabled in your browser.</noscript>

<header>
  <h1>📈 Stock Market Tracker</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="dateBox"></span>
    <span id="statusPill" class="status-pill status-live">LIVE</span>
  </div>
</header>

<div class="toolbar">
  <button id="refreshBtn" type="button">🔄 Refresh Current Price</button>
  <button id="settingsBtn" type="button">⚙ Settings</button>
  <input id="searchBox" class="search" type="text" placeholder="Search by Stock Name / Code...">
  <span class="badge" id="countBadge">0 stocks</span>
</div>

<div id="logBox"></div>

<main>
  <div class="table-wrap">
    <table id="stockTable">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
</main>

<dialog id="settingsDialog">
  <form method="dialog">
    <h3>Settings</h3>

    <label>GitHub repo (owner/repo)</label>
    <input type="text" id="ghRepo" placeholder="jituduttajd-cmyk/STOCK-MARKET-TRACKER">

    <label>CSV file path in repo (exact case, incl. extension)</label>
    <input type="text" id="ghPath" placeholder="Stock-Market-Tracker.CSV">

    <label>Branch</label>
    <input type="text" id="ghBranch" placeholder="main" value="main">

    <label>GitHub Personal Access Token (stored only in this browser)</label>
    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">

    <label>CORS proxy URL prefix (needed to call Screener.in from the browser)</label>
    <input type="text" id="proxyUrl" placeholder="https://your-worker.example.workers.dev/?url=">
    <div class="hint">Screener.in has no public API and blocks direct browser requests (CORS). Point this at your own proxy. The app calls: <code>PROXY + encodeURIComponent('https://www.screener.in/company/'+CODE+'/')</code></div>

    <label>Cut-off time (HH:MM, 24h, IST)</label>
    <input type="text" id="cutoffTime" value="15:45">

    <label>Retention (days of master history to keep)</label>
    <input type="number" id="retentionDays" value="365">

    <div class="dialog-actions">
      <button type="submit" value="cancel">Cancel</button>
      <button type="submit" value="default" id="saveSettings" style="background:var(--primary);color:#fff">Save</button>
    </div>
  </form>
</dialog>

<script>
/* =========================================================================
   STOCK MARKET TRACKER - single-file PWA (v4 - matches actual uploaded CSV)
   CSV header exactly as uploaded to GitHub:
     Stock Name, BSE/NSE Code, Current Price, DD-MM-YYYY, DD-MM-YYYY, ...
   Fixes vs v3:
   - Date format changed from DD.MM.YYYY (dots) to DD-MM-YYYY (hyphens) to
     match the real file (01-09-2026, 02-09-2026, ...)
   - "Current Price" is now a genuine stored CSV column (col index 2), kept in
     sync with today's dated column on every refresh and at cut-off lock,
     instead of being a purely computed/display-only value
   - All other logic (refresh button, 3:45 PM lock, 365-day retention,
     GitHub auto-commit, on-screen error logging) unchanged from v3
   ========================================================================= */

const LS = { cfg:'smt_config', csvCache:'smt_csv_cache', sha:'smt_file_sha', lockedDates:'smt_locked_dates' };

let CONFIG = loadConfig();
let stocks = [];        // [{name, code, prices: {"DD-MM-YYYY": value}}]
let dateColumns = [];   // full stored history, oldest -> newest, format DD-MM-YYYY
let lockedDates = new Set(JSON.parse(localStorage.getItem(LS.lockedDates) || '[]'));
let fileSha = localStorage.getItem(LS.sha) || null;

function log(msg, isError){
  const box = document.getElementById('logBox');
  if(!box) return;
  const time = new Date().toLocaleTimeString();
  const line = `[${time}] ${isError ? '❌ ' : ''}${msg}`;
  box.innerHTML = `<div class="${isError?'err':''}">${line}</div>` + box.innerHTML;
}

window.onerror = function(message, source, lineno, colno, error){
  log(`Script error: ${message} (line ${lineno})`, true);
  return false;
};
window.addEventListener('unhandledrejection', (e) => {
  log(`Unhandled promise error: ${e.reason && e.reason.message ? e.reason.message : e.reason}`, true);
});

function loadConfig(){
  const raw = localStorage.getItem(LS.cfg);
  return raw ? JSON.parse(raw) : {
    ghRepo:'', ghPath:'Stock-Market-Tracker.CSV', ghBranch:'main',
    ghToken:'', proxyUrl:'', cutoffTime:'15:45', retentionDays:365
  };
}
function saveConfig(c){ localStorage.setItem(LS.cfg, JSON.stringify(c)); }

/* ---------------- Date helpers (IST, DD-MM-YYYY to match uploaded CSV) ---------------- */
function nowIST(){
  const utc = Date.now() + (new Date().getTimezoneOffset() * 60000);
  return new Date(utc + 5.5 * 3600000);
}
function fmtDMY(d){
  return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
}
function parseDMY(s){
  const [dd,mm,yyyy] = s.split('-').map(Number);
  return new Date(yyyy, mm-1, dd);
}
function todayKey(){ return fmtDMY(nowIST()); }
function cutoffPassedToday(){
  const [h,m] = CONFIG.cutoffTime.split(':').map(Number);
  const d = nowIST();
  const cutoff = new Date(d); cutoff.setHours(h, m, 0, 0);
  return d >= cutoff;
}
function currentMonthDates(){
  const t = nowIST();
  const first = new Date(t.getFullYear(), t.getMonth(), 1);
  const out = [];
  for(let d = new Date(first); d <= t; d.setDate(d.getDate()+1)){
    out.push(fmtDMY(d));
  }
  return out;
}

/* ---------------- CSV parse / build ---------------- */
// CSV shape (matches uploaded file): Stock Name, BSE/NSE Code, Current Price, <DD-MM-YYYY...>
function parseCSV(text){
  const rows = text.trim().split(/\r?\n/).map(r => splitCsvLine(r));
  const header = rows[0] || [];
  // header[0]=Stock Name, header[1]=BSE/NSE Code, header[2]=Current Price, header[3..]=dates
  dateColumns = header.slice(3);
  stocks = rows.slice(1).filter(r => r.length && r[1] !== '').map(r => {
    const prices = {};
    dateColumns.forEach((d,i) => prices[d] = r[3+i] ?? '');
    return { name: r[0]||'', code: r[1]||'', prices };
  });
}
function splitCsvLine(line){
  const out = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(c === '"'){ inQ = !inQ; continue; }
    if(c === ',' && !inQ){ out.push(cur); cur=''; continue; }
    cur += c;
  }
  out.push(cur);
  return out;
}
function buildCSV(){
  const t = todayKey();
  const header = ['Stock Name','BSE/NSE Code','Current Price', ...dateColumns];
  const lines = [header.join(',')];
  stocks.forEach(s => {
    const currentPrice = s.prices[t] ?? '';
    const row = [csvSafe(s.name), s.code, currentPrice, ...dateColumns.map(d => s.prices[d] ?? '')];
    lines.push(row.join(','));
  });
  return lines.join('\n');
}
function csvSafe(v){ return /[,"\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }

function trimRetention(){
  const max = Number(CONFIG.retentionDays) || 365;
  const sorted = [...dateColumns].sort((a,b) => parseDMY(a) - parseDMY(b));
  if(sorted.length > max){
    const drop = sorted.slice(0, sorted.length - max);
    dateColumns = sorted.slice(sorted.length - max);
    stocks.forEach(s => drop.forEach(d => delete s.prices[d]));
    log(`Trimmed ${drop.length} old date column(s) beyond ${max}-day retention.`);
  } else {
    dateColumns = sorted;
  }
}
function ensureTodayColumn(){
  const t = todayKey();
  if(!dateColumns.includes(t)){
    dateColumns.push(t);
    stocks.forEach(s => { s.prices[t] = ''; });
    log(`Added new date column for ${t}.`);
  }
  trimRetention();
}

/* ---------------- GitHub Contents API ---------------- */
async function ghGetFile(){
  const { ghRepo, ghPath, ghBranch, ghToken } = CONFIG;
  const url = `https://api.github.com/repos/${ghRepo}/contents/${encodeURIComponent(ghPath)}?ref=${ghBranch}`;
  const res = await fetch(url, {
    headers: ghToken ? { Authorization:`Bearer ${ghToken}`, Accept:'application/vnd.github+json' }
                      : { Accept:'application/vnd.github+json' }
  });
  if(!res.ok) throw new Error(`GitHub GET failed: ${res.status} (check repo/path/branch/token - path is case-sensitive)`);
  const data = await res.json();
  fileSha = data.sha;
  localStorage.setItem(LS.sha, fileSha);
  return decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
}
async function ghPutFile(csvText, message){
  const { ghRepo, ghPath, ghBranch, ghToken } = CONFIG;
  if(!ghToken) throw new Error('Missing GitHub token in Settings.');
  const url = `https://api.github.com/repos/${ghRepo}/contents/${encodeURIComponent(ghPath)}`;
  const body = {
    message: message || `Auto-update ${todayKey()} prices`,
    content: btoa(unescape(encodeURIComponent(csvText))),
    branch: ghBranch,
    sha: fileSha || undefined
  };
  const res = await fetch(url, {
    method:'PUT',
    headers:{ Authorization:`Bearer ${ghToken}`, 'Content-Type':'application/json', Accept:'application/vnd.github+json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text(); throw new Error(`GitHub PUT failed: ${res.status} ${t}`); }
  const data = await res.json();
  fileSha = data.content.sha;
  localStorage.setItem(LS.sha, fileSha);
  log('Auto-committed CSV update to GitHub.');
}

/* ---------------- Screener.in price fetch ---------------- */
async function fetchScreenerPrice(code){
  if(!CONFIG.proxyUrl){ throw new Error('Set a CORS proxy URL in Settings first.'); }
  const target = `https://www.screener.in/company/${code}/`;
  const proxied = CONFIG.proxyUrl + encodeURIComponent(target);
  const res = await fetch(proxied);
  if(!res.ok) throw new Error(`Proxy fetch failed (${res.status}) for ${code}`);
  const html = await res.text();
  return extractCurrentPrice(html);
}
function extractCurrentPrice(html){
  const liRegex = /<li[^>]*>\s*<span class="name">\s*Current Price\s*<\/span>[\s\S]*?<span class="number">\s*([\d,]+\.?\d*)\s*<\/span>/i;
  const m = html.match(liRegex);
  if(m) return parseFloat(m[1].replace(/,/g,''));
  const fallback = html.match(/Current Price[\s\S]{0,200}?([\d]{1,3}(?:,\d{3})*\.\d{1,2})/i);
  if(fallback) return parseFloat(fallback[1].replace(/,/g,''));
  throw new Error('Could not locate Current Price in page - Screener.in markup may have changed.');
}

/* ---------------- Refresh flow ---------------- */
async function refreshAll(){
  if(!stocks.length){ log('No stocks loaded yet - check Settings / GitHub CSV connection.', true); return; }
  if(lockedDates.has(todayKey())){ log('Today is already locked at cut-off; refresh disabled.'); return; }
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '⏳ Refreshing...';
  const t = todayKey();
  let ok = 0, fail = 0;
  for(const s of stocks){
    if(!s.code){ continue; }
    try{
      const price = await fetchScreenerPrice(s.code);
      s.prices[t] = price;
      ok++;
    }catch(e){
      fail++;
      log(`⚠ ${s.code}: ${e.message}`, true);
    }
    renderTable(document.getElementById('searchBox').value);
    await new Promise(r => setTimeout(r, 400));
  }
  btn.disabled = false; btn.textContent = '🔄 Refresh Current Price';
  log(`Refresh complete: ${ok} updated, ${fail} failed.`);
  cacheLocally();
}

/* ---------------- Cut-off lock ---------------- */
function checkCutoffLock(){
  const t = todayKey();
  if(cutoffPassedToday() && !lockedDates.has(t)){
    lockedDates.add(t);
    localStorage.setItem(LS.lockedDates, JSON.stringify([...lockedDates]));
    log(`Cut-off (${CONFIG.cutoffTime} IST) reached - locking ${t} and committing to GitHub.`);
    setStatusPill(true);
    ghPutFile(buildCSV(), `Lock ${t} prices at cut-off`).catch(e => log('Auto-commit failed: ' + e.message, true));
    cacheLocally();
  } else {
    setStatusPill(cutoffPassedToday());
  }
}
function setStatusPill(locked){
  const el = document.getElementById('statusPill');
  el.textContent = locked ? 'LOCKED' : 'LIVE';
  el.className = 'status-pill ' + (locked ? 'status-locked' : 'status-live');
  document.getElementById('refreshBtn').disabled = locked;
}

/* ---------------- Rendering ---------------- */
function renderTable(filter=''){
  const head = document.getElementById('headRow');
  const body = document.getElementById('bodyRows');
  const t = todayKey();
  const monthCols = currentMonthDates();

  head.innerHTML = '<th>Stock Name</th><th>BSE/NSE Code</th><th>Current Price</th>' +
    monthCols.map(d => `<th class="${d===t?'today-col':''}">${d}</th>`).join('');

  const f = filter.trim().toLowerCase();
  const rows = stocks.filter(s =>
    !f || s.code.toLowerCase().includes(f) || s.name.toLowerCase().includes(f)
  );

  body.innerHTML = rows.map(s => {
    const curPrice = s.prices[t];
    const curCls = lockedDates.has(t) ? 'locked-cell' : 'live-cell';
    const curCell = `<td class="${curCls}">${curPrice !== '' && curPrice !== undefined ? curPrice : '-'}</td>`;
    const dateCells = monthCols.map(d => {
      const val = s.prices[d];
      const isToday = d === t;
      const cls = isToday ? (lockedDates.has(d) ? 'locked-cell' : 'live-cell') : 'locked-cell';
      return `<td class="${isToday?'today-col':''} ${cls}">${val !== '' && val !== undefined ? val : '-'}</td>`;
    }).join('');
    return `<tr><td>${s.name}</td><td>${s.code}</td>${curCell}${dateCells}</tr>`;
  }).join('');

  document.getElementById('dateBox').textContent = `Today: ${t} (IST)`;
  document.getElementById('countBadge').textContent = `${rows.length} stocks`;
}

function cacheLocally(){ localStorage.setItem(LS.csvCache, buildCSV()); }

/* ---------------- In-browser PWA: manifest + service worker (hardened) ---------------- */
function registerPWA(){
  try{
    const manifest = {
      name: "Stock Market Tracker",
      short_name: "StockTracker",
      description: "Daily BSE/NSE current price tracker synced with GitHub CSV, locking prices at cut-off time.",
      start_url: ".",
      scope: ".",
      display: "standalone",
      background_color: "#f4f6f9",
      theme_color: "#0b5394"
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);
  }catch(e){
    log('Manifest setup skipped: ' + e.message, true);
  }

  try{
    if(!('serviceWorker' in navigator)) return;
    if(location.protocol === 'file:'){
      log('Service worker/PWA install skipped: open this app via https:// or a local server, not by double-clicking the file.');
      return;
    }
    const swSource = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => self.clients.claim());
      self.addEventListener('fetch', event => {
        const url = new URL(event.request.url);
        if (url.hostname.includes('api.github.com') || url.hostname.includes('screener.in') || event.request.method !== 'GET') {
          event.respondWith(fetch(event.request));
          return;
        }
        event.respondWith(fetch(event.request).catch(() => caches.match(event.request)));
      });
    `;
    const swBlob = new Blob([swSource], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(e => log('Service worker registration failed (app still works without offline caching): ' + e.message, true));
  }catch(e){
    log('Service worker setup skipped (app still works fine without it): ' + e.message, true);
  }
}

/* ---------------- Init ---------------- */
async function init(){
  populateSettingsForm();
  let csvText = localStorage.getItem(LS.csvCache);
  try{
    if(CONFIG.ghRepo){
      csvText = await ghGetFile();
      log('Loaded CSV from GitHub repo.');
    } else if(csvText){
      log('Loaded CSV from local cache (open Settings and connect your GitHub repo to sync live).');
    } else {
      csvText = 'Stock Name,BSE/NSE Code,Current Price\n';
      log('No CSV source configured yet - open ⚙ Settings and connect your GitHub repo.');
    }
  }catch(e){
    log('Could not load from GitHub: ' + e.message, true);
    csvText = csvText || 'Stock Name,BSE/NSE Code,Current Price\n';
  }
  parseCSV(csvText);
  ensureTodayColumn();
  renderTable();
  setStatusPill(cutoffPassedToday());
  cacheLocally();

  setInterval(() => {
    const t = todayKey();
    if(!dateColumns.includes(t)){ ensureTodayColumn(); renderTable(document.getElementById('searchBox').value); }
    checkCutoffLock();
  }, 30000);
}

function populateSettingsForm(){
  document.getElementById('ghRepo').value = CONFIG.ghRepo;
  document.getElementById('ghPath').value = CONFIG.ghPath;
  document.getElementById('ghBranch').value = CONFIG.ghBranch;
  document.getElementById('ghToken').value = CONFIG.ghToken;
  document.getElementById('proxyUrl').value = CONFIG.proxyUrl;
  document.getElementById('cutoffTime').value = CONFIG.cutoffTime;
  document.getElementById('retentionDays').value = CONFIG.retentionDays;
}
function readSettingsForm(){
  CONFIG = {
    ghRepo: document.getElementById('ghRepo').value.trim(),
    ghPath: document.getElementById('ghPath').value.trim() || 'Stock-Market-Tracker.CSV',
    ghBranch: document.getElementById('ghBranch').value.trim() || 'main',
    ghToken: document.getElementById('ghToken').value.trim(),
    proxyUrl: document.getElementById('proxyUrl').value.trim(),
    cutoffTime: document.getElementById('cutoffTime').value.trim() || '15:45',
    retentionDays: Number(document.getElementById('retentionDays').value) || 365
  };
}

function wireButtons(){
  const refreshBtn = document.getElementById('refreshBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsDialog = document.getElementById('settingsDialog');
  const saveSettingsBtn = document.getElementById('saveSettings');
  const searchBox = document.getElementById('searchBox');

  if(refreshBtn) refreshBtn.addEventListener('click', refreshAll);

  if(settingsBtn && settingsDialog){
    settingsBtn.addEventListener('click', () => {
      if(typeof settingsDialog.showModal === 'function'){
        settingsDialog.showModal();
      } else {
        log('Your browser does not support the <dialog> element - please update your browser.', true);
      }
    });
  }

  if(saveSettingsBtn){
    saveSettingsBtn.addEventListener('click', (e) => {
      e.preventDefault();
      readSettingsForm();
      saveConfig(CONFIG);
      settingsDialog.close();
      log('Settings saved.');
      init();
    });
  }

  if(searchBox) searchBox.addEventListener('input', (e) => renderTable(e.target.value));
}

document.addEventListener('DOMContentLoaded', () => {
  try{
    wireButtons();
    registerPWA();
    init();
  }catch(e){
    log('Startup error: ' + e.message, true);
  }
});
</script>
</body>
</html>
